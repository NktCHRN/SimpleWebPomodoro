<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Square app icon: opaque background (iOS fills transparency with black),
       logo kept inside the central safe zone so Android masks don't clip it. -->
  <rect width="64" height="64" fill="#fff"/>
  <g transform="translate(32 32) scale(0.72) translate(-32 -33)">
    <circle cx="32" cy="37" r="24" fill="#d9534f"/>
    <ellipse cx="16.5" cy="31" rx="4" ry="2.5" fill="#fff" opacity="0.25" transform="rotate(-55 16.5 31)"/>
    <rect x="30.5" y="5" width="3" height="10" rx="1.5" fill="#2f8a4e"/>
    <path d="M32 15 C27 9 20 9 16 12 C21 13 24 15 26 17 C21 17 17 19 15 22 C21 21 27 21 32 19
             C37 21 43 21 49 22 C47 19 43 17 38 17 C40 15 43 13 48 12 C44 9 37 9 32 15 Z"
          fill="#3a9d5d"/>
    <circle cx="32" cy="39" r="12" fill="none" stroke="#fff" stroke-opacity="0.35" stroke-width="4"/>
    <circle cx="32" cy="39" r="12" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"
            stroke-dasharray="12.06 100" transform="rotate(-90 32 39)"/>
    <line x1="32" y1="39" x2="38.75" y2="34.71" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <circle cx="32" cy="39" r="2.5" fill="#fff"/>
  </g>
</svg>
