server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Not every nginx mime.types lists .webmanifest. Scoped to this location,
    # because a types block replaces (not extends) the inherited MIME map.
    location ~ \.webmanifest$ {
        types { }
        default_type application/manifest+json;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # The browser must always fetch the latest service worker.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript text/javascript image/svg+xml application/manifest+json;
}
